name: Build fixpot's Server Playtime

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        run: gradle build --stacktrace

      - name: Prepare final jar
        run: |
          mkdir -p dist
          JAR=$(find build/libs -maxdepth 1 -type f -name 'fixpot-s-server-playtime-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" dist/fixpot-s-server-playtime.jar

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: fixpot-s-server-playtime-1.1.0-26.3
          path: dist/fixpot-s-server-playtime.jar
